services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-stack}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-stack}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_CONTEXT_LENGTH=8192
      - OLLAMA_KEEP_ALIVE=-1
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_API_BASE_URL=http://pipelines:9099
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENABLE_API_KEYS=true
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=tavily
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - RAG_WEB_SEARCH_RESULT_COUNT=5
      - RAG_WEB_SEARCH_CONCURRENT_REQUESTS=10
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=nomic-embed-text
      - ENABLE_CODE_EXECUTION=true
      - CODE_EXECUTION_ENGINE=pyodide
      - ENABLE_CODE_INTERPRETER=true
      - WEBUI_NAME=${WEBUI_NAME:-Local AI}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    env_file:
      - path: mcpo/owui.env
        required: false
    volumes:
      - open_webui_data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
      - pipelines
    restart: unless-stopped

  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: pipelines
    ports:
      - "127.0.0.1:9099:9099"
    environment:
      - PIPELINES_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./pipeline/owui_pipeline.py:/app/pipelines/owui_pipeline.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      # Workflows read these via $env (branding + webhook secret check)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - BUSINESS_NAME=${BUSINESS_NAME}
      - BUSINESS_REGION=${BUSINESS_REGION}
      - CALENDLY_URL=${CALENDLY_URL}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      - N8N_SECURE_COOKIE=false
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE=true
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional public tunnel to Open WebUI. Off by default:
  #   docker compose --profile tunnel up -d
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    profiles: ["tunnel"]
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http open-webui:8080 --pooling-enabled
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      - open-webui
    restart: unless-stopped

volumes:
  ollama_data:
  open_webui_data:
  n8n_data:
  postgres_data:
